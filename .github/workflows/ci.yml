# CI = every push and pull request is tested automatically on GitHub's machines.
# The test, image and terraform jobs never touch AWS. Only the deploy job (CD)
# at the bottom does: OIDC credentials (best practice) or a least-privilege deploy user.
name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button: redeploy main without a new commit (e.g. after a rebuild)

permissions:
  contents: read # least privilege: the workflow can only read the code

jobs:
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest==8.3.3 httpx==0.27.2
      - name: Run tests
        run: python -m pytest -q

  image:
    name: Docker build + Trivy scan
    needs: test # only build if the tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (tagged with the git commit SHA)
        run: docker build -t cloudpose:${{ github.sha }} --build-arg APP_VERSION=${{ github.sha }} app
      - name: Scan for HIGH/CRITICAL vulnerabilities (report only)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.56.2 image --severity HIGH,CRITICAL --ignore-unfixed
          --no-progress --exit-code 0 cloudpose:${{ github.sha }}

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra/k8s, infra/aws/bootstrap, infra/aws/app]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Formatting
        run: terraform fmt -check -recursive
      - name: Init (no backend, no cloud access)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  # ------------------------------------------------------------------ CD
  # Runs only for main (a push or the Run workflow button, never pull requests), and only if all
  # three CI jobs above passed. Deploys the commit to ECS Fargate.
  deploy:
    name: Deploy to AWS (ECS Fargate)
    needs: [test, image, terraform]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-production # never two deploys at the same time
    permissions:
      contents: read
      id-token: write # lets this job ask GitHub for an OIDC token (the "ID card")
    env:
      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY: cloudpose
      ECS_CLUSTER: cloudpose-cluster
      ECS_SERVICE: cloudpose
      TASK_FAMILY: cloudpose
      CONTAINER_NAME: cloudpose
    steps:
      - uses: actions/checkout@v4

      # Best practice (cd_auth = "oidc"): set the repo VARIABLE AWS_ROLE_ARN. GitHub's OIDC token
      # is swapped for temporary AWS credentials (about 1 hour) and no keys are stored.
      # Fallback (cd_auth = "iam_user"): leave AWS_ROLE_ARN unset and add the repo SECRETS
      # AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY for the least-privilege deploy user.
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Same image as CI, tagged with the commit SHA, so every deploy maps to one commit.
      # --provenance=false pushes a plain image (no attestation index), so ECR scan-on-push works.
      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          # Tags are IMMUTABLE, so a re-run of this job must not push the same tag twice.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "Image for this commit is already in ECR, skipping build and push"
          else
            docker build --provenance=false -t "$IMAGE" --build-arg APP_VERSION=${{ github.sha }} app
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Start from the live task definition (Terraform made it), change only the image.
      - name: Download current task definition
        run: aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > task-definition.json

      - name: Put the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}
          environment-variables: APP_VERSION=${{ github.sha }}

      # Registers a new revision and rolls the service (new tasks first, then old ones stop).
      # If the new tasks never pass /health, the circuit breaker rolls back automatically.
      - name: Deploy to ECS and wait until stable
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      # Prove the NEW version is what users get: /health reports the commit SHA.
      - name: Smoke test through the load balancer
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          url="${APP_URL%/}"   # drop a trailing slash, otherwise the path becomes //health (404)
          body=$(curl -fsS --retry 5 --retry-delay 10 "$url/health")
          echo "$body"
          echo "$body" | grep -q "${{ github.sha }}"
